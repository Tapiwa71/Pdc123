<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Submit meal order</title>
<style>
  body { font-family: -apple-system, Arial, sans-serif; max-width: 640px; margin: 2rem auto; padding: 0 1rem; color: #222; }
  h1 { font-size: 20px; }
  .tabs { display: flex; gap: 8px; margin-bottom: 1rem; }
  .tabs button { padding: 8px 14px; border: 1px solid #ccc; background: #f5f5f5; cursor: pointer; border-radius: 4px; }
  .tabs button.active { background: #222; color: #fff; }
  .panel { display: none; }
  .panel.active { display: block; }
  label { display: block; margin-top: 12px; font-size: 14px; font-weight: 600; }
  input, select, textarea { width: 100%; padding: 8px; margin-top: 4px; font-size: 14px; box-sizing: border-box; }
  textarea { height: 160px; font-family: monospace; }
  .row { display: flex; gap: 8px; margin-top: 8px; align-items: center; }
  .row select, .row input { width: auto; flex: 1; }
  button.primary { margin-top: 16px; padding: 10px 18px; background: #1a7f4f; color: #fff; border: none; border-radius: 4px; cursor: pointer; font-size: 15px; }
  button.small { padding: 4px 10px; }
  #msg { margin-top: 12px; padding: 10px; border-radius: 4px; display: none; }
  #msg.ok { background: #d1e7dd; display: block; }
  #msg.err { background: #f8d7da; display: block; }
  datalist { }
</style>
</head>
<body>
  <h1>Submit your meal order</h1>

  <div class="tabs">
    <button id="tabPaste" class="active" onclick="showTab('paste')">Paste order text</button>
    <button id="tabForm" onclick="showTab('form')">Fill in a form</button>
  </div>

  <!-- Paste mode: same format the team already uses -->
  <div id="panelPaste" class="panel active">
    <label>Location name, then brand + Am/Pm quantities (same format you'd send on WhatsApp)</label>
    <textarea id="pasteText" placeholder="Greenfields
Pizza inn
Am 4
Pm 4
Innbucks
Am 1"></textarea>
    <button class="primary" onclick="submitPaste()">Submit order</button>
  </div>

  <!-- Structured form mode -->
  <div id="panelForm" class="panel">
    <label>Location</label>
    <input list="locations" id="formLocation" placeholder="Start typing..." />
    <datalist id="locations"></datalist>

    <label>Order items</label>
    <div id="itemRows"></div>
    <button class="small" onclick="addRow()">+ Add item</button>

    <button class="primary" onclick="submitForm()">Submit order</button>
  </div>

  <div id="msg"></div>

<script>
const BRANDS = [];
fetch('/api/brands').then(r => r.json()).then(b => { BRANDS.push(...b); });
fetch('/api/locations').then(r => r.json()).then(locs => {
  document.getElementById('locations').innerHTML = locs.map(l => `<option value="${l}">`).join('');
});

function showTab(which) {
  document.getElementById('tabPaste').classList.toggle('active', which === 'paste');
  document.getElementById('tabForm').classList.toggle('active', which === 'form');
  document.getElementById('panelPaste').classList.toggle('active', which === 'paste');
  document.getElementById('panelForm').classList.toggle('active', which === 'form');
}

function addRow() {
  const div = document.createElement('div');
  div.className = 'row';
  div.innerHTML = `
    <select class="brandSel">${BRANDS.map(b => `<option value="${b}">${b}</option>`).join('')}</select>
    <select class="sessionSel"><option value="AM">AM</option><option value="PM">PM</option><option value="">(none)</option></select>
    <input class="qtyInput" type="number" min="0" placeholder="qty" style="max-width:80px" />
    <button class="small" onclick="this.parentElement.remove()">x</button>
  `;
  document.getElementById('itemRows').appendChild(div);
}
addRow();

function showMsg(text, ok) {
  const el = document.getElementById('msg');
  el.textContent = text;
  el.className = ok ? 'ok' : 'err';
}

async function submitPaste() {
  const text = document.getElementById('pasteText').value;
  const res = await fetch('/api/orders/paste', {
    method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ text })
  });
  const data = await res.json();
  if (res.ok) {
    showMsg(`Order recorded for ${data.location} (${data.lines.length} items).`, true);
    document.getElementById('pasteText').value = '';
  } else {
    showMsg(data.error || 'Something went wrong.', false);
  }
}

async function submitForm() {
  const location = document.getElementById('formLocation').value.trim();
  const rows = [...document.querySelectorAll('#itemRows .row')];
  const lines = rows.map(r => ({
    brand: r.querySelector('.brandSel').value,
    session: r.querySelector('.sessionSel').value || null,
    qty: parseInt(r.querySelector('.qtyInput').value, 10),
  })).filter(l => l.qty > 0);

  if (!location || lines.length === 0) {
    showMsg('Please enter a location and at least one item with a quantity.', false);
    return;
  }

  const res = await fetch('/api/orders', {
    method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ location, lines })
  });
  const data = await res.json();
  if (res.ok) {
    showMsg(`Order recorded for ${data.location} (${data.lines.length} items).`, true);
    document.getElementById('formLocation').value = '';
    document.getElementById('itemRows').innerHTML = '';
    addRow();
  } else {
    showMsg(data.error || 'Something went wrong.', false);
  }
}
</script>
</body>
</html>
