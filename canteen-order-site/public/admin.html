<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>ProCanteen — dispatch admin</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@700&family=IBM+Plex+Mono:wght@400;600&family=Inter:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/styles.css">
<style>
  body { max-width: 900px; }
  .toolbar { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 1.5rem; }
  .toolbar button, .toolbar a button {
    padding: 10px 16px; background: transparent; border: 1.5px solid var(--cream-dim);
    color: var(--cream); border-radius: 6px; cursor: pointer; font-family: var(--font-body); font-size: 13px; font-weight: 600;
  }
  .toolbar a button:hover, .toolbar button:hover { border-color: var(--sunflower); color: var(--sunflower); }
  h3 { font-family: var(--font-display); font-size: 15px; color: var(--sunflower); margin: 1.5rem 0 0.5rem; }
  #missingList { margin: 0.5rem 0 1.5rem; }
  .confirm-btn {
    padding: 4px 10px; background: transparent; border: 1.5px dashed var(--avocado);
    color: var(--avocado); border-radius: 6px; cursor: pointer; font-size: 12px; font-family: var(--font-mono);
  }
</style>
</head>
<body>
  <div class="pc-header">
    <div class="pc-badge">PC</div>
    <div>
      <p class="pc-title">Dispatch admin</p>
      <p class="pc-subtitle" id="dateLabel"></p>
    </div>
  </div>

  <div class="toolbar">
    <button onclick="applyCutoff()">Apply 7am cutoff defaults</button>
    <a href="/api/export/cards"><button>Download dispatch cards (.xlsx)</button></a>
    <a href="/api/export/datasheet"><button>Download datasheet (.xlsx)</button></a>
  </div>

  <h3>Not yet ordered today</h3>
  <div id="missingList" class="missing">Loading…</div>

  <h3>Orders received</h3>
  <table>
    <thead>
      <tr><th>Location</th><th>Status</th><th>Sender</th><th>Line items</th><th>Received</th><th></th></tr>
    </thead>
    <tbody id="ordersBody"></tbody>
  </table>

<script>
const today = new Date().toISOString().slice(0,10);
document.getElementById('dateLabel').textContent = today;

async function load() {
  const day = await fetch('/api/orders?date=' + today).then(r => r.json());
  const body = document.getElementById('ordersBody');
  body.innerHTML = '';
  for (const [loc, order] of Object.entries(day.locations || {})) {
    const tr = document.createElement('tr');
    const items = order.lines.map(l => `${l.brand} ${l.session||''} ${l.qty}`).join(', ');
    tr.innerHTML = `
      <td>${loc}</td>
      <td><span class="stamp stamp-${order.status}">${order.status}</span></td>
      <td>${order.sender || ''}</td>
      <td>${items}</td>
      <td>${new Date(order.receivedAt).toLocaleTimeString()}</td>
      <td>${order.status !== 'confirmed' ? `<button class="confirm-btn" onclick="confirmOrder('${loc}')">Confirm</button>` : ''}</td>
    `;
    body.appendChild(tr);
  }

  const missing = await fetch('/api/missing?date=' + today).then(r => r.json());
  document.getElementById('missingList').textContent =
    missing.missing.length ? missing.missing.join(', ') : 'None — everyone has ordered.';
}

async function confirmOrder(loc) {
  await fetch(`/api/orders/${today}/${encodeURIComponent(loc)}/confirm`, { method: 'POST' });
  load();
}

async function applyCutoff() {
  const yesterday = new Date(Date.now() - 86400000).toISOString().slice(0,10);
  const res = await fetch('/api/apply-cutoff-defaults', {
    method: 'POST', headers: {'Content-Type':'application/json'},
    body: JSON.stringify({ date: today, previousDate: yesterday })
  }).then(r => r.json());
  alert('Carried over previous day order for: ' + (res.appliedTo.join(', ') || 'none needed'));
  load();
}

load();
</script>
</body>
</html>
