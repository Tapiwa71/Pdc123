<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Canteen dispatch dashboard</title>
<style>
  body { font-family: -apple-system, Arial, sans-serif; max-width: 900px; margin: 2rem auto; padding: 0 1rem; color: #222; }
  h1 { font-size: 20px; }
  table { width: 100%; border-collapse: collapse; margin-top: 1rem; }
  th, td { text-align: left; padding: 8px; border-bottom: 1px solid #ddd; font-size: 14px; }
  .status { padding: 2px 8px; border-radius: 4px; font-size: 12px; }
  .status-received { background: #fff3cd; }
  .status-reviewed { background: #cfe2ff; }
  .status-confirmed { background: #d1e7dd; }
  .status-carried_over { background: #f8d7da; }
  button { padding: 6px 12px; margin-right: 8px; cursor: pointer; }
  .missing { color: #a33; font-size: 13px; }
  #missingList { margin: 0.5rem 0 1.5rem; }
</style>
</head>
<body>
  <h1>Dispatch admin — <span id="dateLabel"></span></h1>

  <div>
    <button onclick="applyCutoff()">Apply 7am cutoff defaults</button>
    <a href="/api/export/cards"><button>Download dispatch cards (.xlsx)</button></a>
    <a href="/api/export/datasheet"><button>Download datasheet (.xlsx)</button></a>
  </div>

  <h3>Not yet ordered today</h3>
  <div id="missingList" class="missing">Loading…</div>

  <h3>Orders received</h3>
  <table>
    <thead>
      <tr><th>Location</th><th>Status</th><th>Sender</th><th>Line items</th><th>Received</th><th></th></tr>
    </thead>
    <tbody id="ordersBody"></tbody>
  </table>

<script>
const today = new Date().toISOString().slice(0,10);
document.getElementById('dateLabel').textContent = today;

async function load() {
  const day = await fetch('/api/orders?date=' + today).then(r => r.json());
  const body = document.getElementById('ordersBody');
  body.innerHTML = '';
  for (const [loc, order] of Object.entries(day.locations || {})) {
    const tr = document.createElement('tr');
    const items = order.lines.map(l => `${l.brand} ${l.session||''} ${l.qty}`).join(', ');
    tr.innerHTML = `
      <td>${loc}</td>
      <td><span class="status status-${order.status}">${order.status}</span></td>
      <td>${order.sender || ''}</td>
      <td>${items}</td>
      <td>${new Date(order.receivedAt).toLocaleTimeString()}</td>
      <td>${order.status !== 'confirmed' ? `<button onclick="confirmOrder('${loc}')">Confirm</button>` : ''}</td>
    `;
    body.appendChild(tr);
  }

  const missing = await fetch('/api/missing?date=' + today).then(r => r.json());
  document.getElementById('missingList').textContent =
    missing.missing.length ? missing.missing.join(', ') : 'None — everyone has ordered.';
}

async function confirmOrder(loc) {
  await fetch(`/api/orders/${today}/${encodeURIComponent(loc)}/confirm`, { method: 'POST' });
  load();
}

async function applyCutoff() {
  const yesterday = new Date(Date.now() - 86400000).toISOString().slice(0,10);
  const res = await fetch('/api/apply-cutoff-defaults', {
    method: 'POST', headers: {'Content-Type':'application/json'},
    body: JSON.stringify({ date: today, previousDate: yesterday })
  }).then(r => r.json());
  alert('Carried over previous day order for: ' + (res.appliedTo.join(', ') || 'none needed'));
  load();
}

load();
</script>
</body>
</html>
